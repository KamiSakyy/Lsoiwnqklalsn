name: Source playback audit

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Audit four real anime through source APIs
        run: python3 scripts/source_audit.py > source-audit.log 2>&1 || true
      - name: Persist audit log for inspection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source-audit.log
          git commit -m 'Persist source audit results [skip ci]' || true
          git push
