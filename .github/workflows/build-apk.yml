name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT" >&2
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android build tools
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare the uploaded Android source
        shell: bash
        run: |
          rm -rf yoru-android
          unzip -q "Tsuyu-1.20-source (2).zip"
          cat > yoru-android/settings.gradle <<'EOF'
          import org.gradle.api.initialization.resolve.RepositoriesMode

          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'yoru-android'
          include ':app'
          EOF
          cat > yoru-android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.13.0' apply false
          }
          EOF
          cat > yoru-android/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          EOF

      - name: Restore repository release signing key
        shell: bash
        run: |
          set -euo pipefail
          test -s owner-signing/yoru-release.p12
          test -s owner-signing/signing.properties
          mkdir -p yoru-android/owner-signing
          cp owner-signing/yoru-release.p12 yoru-android/owner-signing/yoru-release.p12
          cp owner-signing/signing.properties yoru-android/owner-signing/signing.properties
          chmod 600 yoru-android/owner-signing/yoru-release.p12 yoru-android/owner-signing/signing.properties
          TSUYU_SIGNING_PASSWORD="$(sed -n 's/^storePassword=//p' owner-signing/signing.properties)"
          TSUYU_SIGNING_ALIAS="$(sed -n 's/^keyAlias=//p' owner-signing/signing.properties)"
          test -n "$TSUYU_SIGNING_PASSWORD"
          test -n "$TSUYU_SIGNING_ALIAS"
          keytool -list -keystore yoru-android/owner-signing/yoru-release.p12 \
            -storetype PKCS12 -storepass "$TSUYU_SIGNING_PASSWORD" \
            -alias "$TSUYU_SIGNING_ALIAS" >/dev/null

      - name: Assemble Tsuyu release APK
        working-directory: yoru-android
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --console=plain :app:assembleTsuyuRelease 2>&1 | tee ../gradle-build.log

      - name: Runtime smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          working-directory: .
          script: |
            set -eu
            ROOT="$(git rev-parse --show-toplevel)"
            cd "$ROOT"
            SMOKE_LOG="$ROOT/runtime-smoke.log"
            echo "smoke_pwd=$(pwd) smoke_log=$SMOKE_LOG" > "$SMOKE_LOG"
            APK="yoru-android/app/build/outputs/apk/tsuyu/release/app-tsuyu-release.apk"
            test -s "$APK"
            adb wait-for-device
            adb install -r "$APK"
            : > "$SMOKE_LOG"
            cat > /tmp/smoke.py <<'PY'
            import json
            titles = [
              ("slime4", 59970),
              ("onepiece", 21),
              ("solo2", 58567),
              ("frieren", 52991),
            ]
            for key, mal in titles:
              # Keep the extra shell-safe: the runtime resolves by the stable MAL/Shikimori id.
              value = {"id": "shikimori:%d" % mal, "provider": "shikimori", "nativeId": str(mal), "title": key, "english": key, "mId": mal, "episodesTotal": 24, "episodesAired": 1}
              print(key + "=" + json.dumps(value, ensure_ascii=False, separators=(",", ":")))
            PY
            python3 /tmp/smoke.py | while IFS='=' read -r key json; do
              echo "=== runtime $key ===" | tee -a "$SMOKE_LOG"
              adb shell am force-stop com.tsuyu.line
              adb logcat -c
              if ! adb shell am start -n com.tsuyu.line/.PlayerActivity --es anime "$json" --ed episode 1 2>&1 | tee -a "$SMOKE_LOG"; then
                echo "AM_START_FAILURE_$key" | tee -a "$SMOKE_LOG" >&2
                adb logcat -d -v brief | tail -n 400 | tee -a "$SMOKE_LOG" >&2 || true
                exit 1
              fi
              pass=0
              for n in $(seq 1 90); do
                sleep 1
                runtime_log="$(adb logcat -d -s TsuyuRuntime:I '*:S' 2>/dev/null || true)"
                printf '%s\n' "$runtime_log" > /tmp/runtime-$key.log
                cat /tmp/runtime-$key.log >> "$SMOKE_LOG"
                if echo "$runtime_log" | grep -Eq 'PLAYBACK_READY .*episodes=[1-9][0-9]* .*voices_ep1=[1-9][0-9]*'; then
                  if echo "$runtime_log" | grep -q 'MEDIA_READY'; then pass=1; break; fi
                fi
                if adb shell dumpsys activity activities 2>/dev/null | grep -q 'com.tsuyu.line/.PlayerActivity'; then :; else
                  echo "Activity exited before runtime-ready for $key" | tee -a "$SMOKE_LOG"
                fi
              done
              if [ "$pass" -ne 1 ]; then
                echo "RUNTIME_FAILURE_$key" | tee -a "$SMOKE_LOG" >&2
                adb logcat -d -v brief | tail -n 400 | tee -a "$SMOKE_LOG" >&2 || true
                exit 1
              fi
              echo "RUNTIME_PASS_$key" | tee -a "$SMOKE_LOG"
            done

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tsuyu-build-diagnostics
          path: |
            gradle-build.log
            runtime-smoke.log
          if-no-files-found: warn
          retention-days: 3

      - name: Persist runtime diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set -eu
          ROOT="$(git rev-parse --show-toplevel)"
          LOG="$ROOT/runtime-smoke.log"
          DEBUG="$ROOT/runtime-persist-debug.log"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "diagnostic_pwd=$(pwd) root=$ROOT log=$LOG"
            ls -la "$ROOT" || true
            find "$ROOT" -type f -name 'runtime-smoke.log' -o -name 'runtime-*.log' 2>/dev/null || true
            find /home/runner/work -type f -name 'runtime-smoke.log' 2>/dev/null || true
          } > "$DEBUG"
          if [ ! -s "$LOG" ]; then
            git add "$DEBUG"
            git commit -m "Record Android runtime diagnostic location [skip ci]" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || true
            exit 0
          fi
          git add "$LOG"
          git commit -m "Persist Android runtime smoke diagnostics [skip ci]" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}" || {
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          }

      - name: Copy and verify release APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p handoff
          APK="$(find yoru-android/app/build/outputs/apk/tsuyu/release -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          rm -f handoff/tsuyu-debug.apk handoff/tsuyu-release.apk
          cp "$APK" handoff/tsuyu-release.apk
          unzip -t handoff/tsuyu-release.apk >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs handoff/tsuyu-release.apk
          sha256sum handoff/tsuyu-release.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A handoff
          git commit -m "Handoff release APK [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload release APK for handoff
        uses: actions/upload-artifact@v4
        with:
          name: tsuyu-release-apk
          path: handoff/tsuyu-release.apk
          if-no-files-found: error
          retention-days: 14
