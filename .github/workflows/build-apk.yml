name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT" >&2
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android build tools
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare the uploaded Android source
        shell: bash
        run: |
          rm -rf yoru-android
          unzip -q "Tsuyu-1.20-source (2).zip"
          cat > yoru-android/settings.gradle <<'EOF'
          import org.gradle.api.initialization.resolve.RepositoriesMode

          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'yoru-android'
          include ':app'
          EOF
          cat > yoru-android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.13.0' apply false
          }
          EOF
          cat > yoru-android/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          EOF

      - name: Restore persistent release signing key
        shell: bash
        env:
          TSUYU_RELEASE_SIGNING_BUNDLE: ${{ secrets.TSUYU_RELEASE_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          if [ -z "$TSUYU_RELEASE_SIGNING_BUNDLE" ]; then
            echo "::error::The persistent release signing secret TSUYU_RELEASE_SIGNING_BUNDLE is not configured."
            exit 1
          fi
          export TSUYU_RELEASE_SIGNING_BUNDLE
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          bundle = json.loads(os.environ["TSUYU_RELEASE_SIGNING_BUNDLE"])
          required = ("keystore", "storePassword", "keyAlias", "keyPassword")
          if any(not str(bundle.get(key, "")) for key in required):
              raise SystemExit("Signing bundle is incomplete")
          signing = Path("yoru-android/owner-signing")
          signing.mkdir(parents=True, exist_ok=True)
          (signing / "yoru-release.p12").write_bytes(
              base64.b64decode(bundle["keystore"], validate=True)
          )
          (signing / "signing.properties").write_text(
              "storePassword=" + str(bundle["storePassword"]) + "\n"
              "keyAlias=" + str(bundle["keyAlias"]) + "\n"
              "keyPassword=" + str(bundle["keyPassword"]) + "\n",
              encoding="utf-8",
          )
          PY
          chmod 600 yoru-android/owner-signing/yoru-release.p12 yoru-android/owner-signing/signing.properties
          TSUYU_SIGNING_PASSWORD="$(sed -n 's/^storePassword=//p' yoru-android/owner-signing/signing.properties)"
          TSUYU_SIGNING_ALIAS="$(sed -n 's/^keyAlias=//p' yoru-android/owner-signing/signing.properties)"
          keytool -list -keystore yoru-android/owner-signing/yoru-release.p12 \
            -storetype PKCS12 -storepass "$TSUYU_SIGNING_PASSWORD" \
            -alias "$TSUYU_SIGNING_ALIAS" >/dev/null

      - name: Assemble Tsuyu release APK
        working-directory: yoru-android
        run: gradle --no-daemon --stacktrace :app:assembleTsuyuRelease

      - name: Copy and verify release APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p handoff
          APK="$(find yoru-android/app/build/outputs/apk/tsuyu/release -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          rm -f handoff/tsuyu-debug.apk handoff/tsuyu-release.apk
          cp "$APK" handoff/tsuyu-release.apk
          unzip -t handoff/tsuyu-release.apk >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs handoff/tsuyu-release.apk
          sha256sum handoff/tsuyu-release.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A handoff
          git commit -m "Handoff release APK [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload release APK for handoff
        uses: actions/upload-artifact@v4
        with:
          name: tsuyu-release-apk
          path: handoff/tsuyu-release.apk
          if-no-files-found: error
          retention-days: 14
