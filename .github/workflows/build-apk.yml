name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT" >&2
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android build tools
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare the uploaded Android source
        shell: bash
        run: |
          rm -rf yoru-android
          unzip -q "Tsuyu-1.20-source (2).zip"
          cat > yoru-android/settings.gradle <<'EOF'
          import org.gradle.api.initialization.resolve.RepositoriesMode

          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'yoru-android'
          include ':app'
          EOF
          cat > yoru-android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.13.0' apply false
          }
          EOF
          cat > yoru-android/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          EOF

      - name: Create temporary release signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p yoru-android/owner-signing
          SIGNING_PASSWORD="$(openssl rand -hex 32)"
          printf 'TSUYU_SIGNING_PASSWORD=%s\n' "$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          keytool -genkeypair -noprompt \
            -keystore yoru-android/owner-signing/yoru-release.p12 \
            -storetype PKCS12 \
            -storepass "$SIGNING_PASSWORD" \
            -keypass "$SIGNING_PASSWORD" \
            -alias tsuyu-actions \
            -keyalg RSA \
            -keysize 2048 \
            -validity 365 \
            -dname "CN=Tsuyu Actions, OU=Build, O=Tsuyu, L=CI, ST=CI, C=DE"
          cat > yoru-android/owner-signing/signing.properties <<EOF
          storePassword=$SIGNING_PASSWORD
          keyAlias=tsuyu-actions
          keyPassword=$SIGNING_PASSWORD
          EOF

      - name: Assemble Tsuyu release APK
        working-directory: yoru-android
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --console=plain :app:assembleTsuyuRelease 2>&1 | tee "$GITHUB_WORKSPACE/assemble.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsuyu-build-log
          path: assemble.log
          if-no-files-found: warn
          retention-days: 3

      - name: Expose failed build log
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          cp assemble.log ci-build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-build.log
          git commit -m "CI build log [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Copy and verify release APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p handoff
          APK="$(find yoru-android/app/build/outputs/apk/tsuyu/release -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          rm -f handoff/tsuyu-debug.apk handoff/tsuyu-release.apk
          cp "$APK" handoff/tsuyu-release.apk
          unzip -t handoff/tsuyu-release.apk >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose handoff/tsuyu-release.apk
          sha256sum handoff/tsuyu-release.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A handoff
          git commit -m "Handoff release APK [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload release APK for handoff
        uses: actions/upload-artifact@v4
        with:
          name: tsuyu-release-apk
          path: handoff/tsuyu-release.apk
          if-no-files-found: error
          retention-days: 14
